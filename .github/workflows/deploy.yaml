name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          TURNSTILE_HOSTNAME: ${{ secrets.TURNSTILE_HOSTNAME }}
          CONTACT_LINKS_JSON: ${{ secrets.CONTACT_LINKS_JSON }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TURNSTILE_SITEKEY,TURNSTILE_SECRET,TURNSTILE_HOSTNAME,CONTACT_LINKS_JSON
          script: |
            set -e

            SHA="${{ github.event.workflow_run.head_sha }}"
            IMAGE="ghcr.io/${{ github.repository }}:$SHA"
            CONTAINER="about-site"
            DEPLOY_DIR="$HOME/.deploy/$CONTAINER"
            ENV_FILE="$DEPLOY_DIR/runtime.env"
            DROP_IN_DIR="$HOME/.config/containers/systemd/$CONTAINER.container.d"

            install -d -m 700 "$DEPLOY_DIR" "$DROP_IN_DIR"
            umask 077
            CONTACT_LINKS_B64="$(printf '%s' "$CONTACT_LINKS_JSON" | base64 | tr -d '\n')"
            printf '%s\n' \
              "TURNSTILE_SITEKEY=$TURNSTILE_SITEKEY" \
              "TURNSTILE_SECRET=$TURNSTILE_SECRET" \
              "TURNSTILE_HOSTNAME=$TURNSTILE_HOSTNAME" \
              "CONTACT_LINKS_B64=$CONTACT_LINKS_B64" > "$ENV_FILE"
            chmod 600 "$ENV_FILE"
            printf '[Container]\nEnvironmentFile=%s\n' "$ENV_FILE" > "$DROP_IN_DIR/10-runtime-env.conf"

            PREV_SHA=$(cat "$DEPLOY_DIR/current_sha" 2>/dev/null || echo "")

            podman pull $IMAGE

            # обновляем юнит на новый образ
            sed -i "s|Image=ghcr.io/${{ github.repository }}:.*|Image=$IMAGE|" \
              ~/.config/containers/systemd/$CONTAINER.container

            systemctl --user daemon-reload
            systemctl --user restart $CONTAINER
            sleep 5

            STATUS=$(systemctl --user is-active $CONTAINER)
            if [ "$STATUS" != "active" ]; then
              echo "Deploy failed, rolling back to $PREV_SHA..."
              PREV_IMAGE="ghcr.io/${{ github.repository }}:$PREV_SHA"
              sed -i "s|Image=ghcr.io/${{ github.repository }}:.*|Image=$PREV_IMAGE|" \
                ~/.config/containers/systemd/$CONTAINER.container
              systemctl --user daemon-reload
              systemctl --user restart $CONTAINER
              exit 1
            fi

            # сохраняем текущий SHA
            echo "$SHA" > "$DEPLOY_DIR/current_sha"

            echo "Deploy successful: $SHA"

name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            SHA="${{ github.event.workflow_run.head_sha }}"
            IMAGE="ghcr.io/${{ github.repository }}:$SHA"
            CONTAINER="about-site"

            PREV_SHA=$(cat ~/.deploy/$CONTAINER/current_sha 2>/dev/null || echo "")

            podman pull $IMAGE

            # обновляем юнит на новый образ
            sed -i "s|Image=ghcr.io/${{ github.repository }}:.*|Image=$IMAGE|" \
              ~/.config/containers/systemd/$CONTAINER.container

            systemctl --user daemon-reload
            systemctl --user restart $CONTAINER
            sleep 5

            STATUS=$(systemctl --user is-active $CONTAINER)
            if [ "$STATUS" != "active" ]; then
              echo "Deploy failed, rolling back to $PREV_SHA..."
              PREV_IMAGE="ghcr.io/${{ github.repository }}:$PREV_SHA"
              sed -i "s|Image=ghcr.io/${{ github.repository }}:.*|Image=$PREV_IMAGE|" \
                ~/.config/containers/systemd/$CONTAINER.container
              systemctl --user daemon-reload
              systemctl --user restart $CONTAINER
              exit 1
            fi

            # сохраняем текущий SHA
            mkdir -p ~/.deploy/$CONTAINER
            echo "$SHA" > ~/.deploy/$CONTAINER/current_sha

            echo "Deploy successful: $SHA"
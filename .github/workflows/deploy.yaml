name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.event.workflow_run.head_sha }}

      - name: Deploy
        uses: appleboy/ssh-action@v1
        env:
          TURNSTILE_SITEKEY: ${{ secrets.TURNSTILE_SITEKEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
          TURNSTILE_HOSTNAME: ${{ secrets.TURNSTILE_HOSTNAME }}
          CONTACT_LINKS_JSON: ${{ secrets.CONTACT_LINKS_JSON }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: TURNSTILE_SITEKEY,TURNSTILE_SECRET,TURNSTILE_HOSTNAME,CONTACT_LINKS_JSON,GHCR_USERNAME,GHCR_PULL_TOKEN
          script: |
            set -eu

            SHA="${{ github.event.workflow_run.head_sha }}"
            IMAGE="ghcr.io/${{ github.repository }}:$SHA"
            CONTAINER="about-site"
            DEPLOY_DIR="$HOME/.deploy/$CONTAINER"
            ENV_FILE="$DEPLOY_DIR/runtime.env"
            UNIT_FILE="$HOME/.config/containers/systemd/$CONTAINER.container"
            REGISTRY_AUTH_FILE="$HOME/.config/containers/auth.json"

            install -d -m 700 "$DEPLOY_DIR" "$(dirname "$UNIT_FILE")" "$(dirname "$REGISTRY_AUTH_FILE")"
            umask 077
            printf '%s' "$GHCR_PULL_TOKEN" | podman login --authfile "$REGISTRY_AUTH_FILE" \
              --username "$GHCR_USERNAME" --password-stdin ghcr.io
            unset GHCR_PULL_TOKEN
            CONTACT_LINKS_B64="$(printf '%s' "$CONTACT_LINKS_JSON" | base64 | tr -d '\n')"
            printf '%s\n' \
              "TURNSTILE_SITEKEY=$TURNSTILE_SITEKEY" \
              "TURNSTILE_SECRET=$TURNSTILE_SECRET" \
              "TURNSTILE_HOSTNAME=$TURNSTILE_HOSTNAME" \
              "CONTACT_LINKS_B64=$CONTACT_LINKS_B64" > "$ENV_FILE"
            chmod 600 "$ENV_FILE"

            # Podman 4.9 does not merge Quadlet .container.d drop-ins. Keep this
            # setting in the source unit so every supported Podman version passes
            # the runtime environment file to `podman run`.
            if ! grep -Fqx "EnvironmentFile=$ENV_FILE" "$UNIT_FILE"; then
              sed -i "/^Image=ghcr.io/${{ github.repository }}:/a EnvironmentFile=$ENV_FILE" "$UNIT_FILE"
            fi

            PREV_SHA=$(cat "$DEPLOY_DIR/current_sha" 2>/dev/null || echo "")

            podman pull --authfile "$REGISTRY_AUTH_FILE" "$IMAGE"

            # обновляем юнит на новый образ
            sed -i "s|Image=ghcr.io/${{ github.repository }}:.*|Image=$IMAGE|" \
              "$UNIT_FILE"

            systemctl --user daemon-reload
            if ! systemctl --user restart "$CONTAINER"; then
              echo "Failed to restart $CONTAINER."
              systemctl --user status "$CONTAINER" --no-pager || true
              journalctl --user --unit "$CONTAINER" --lines 100 --no-pager || true
              exit 1
            fi
            sleep 5

            if ! systemctl --user is-active --quiet "$CONTAINER"; then
              echo "Deploy failed, rolling back to $PREV_SHA..."
              systemctl --user status "$CONTAINER" --no-pager || true
              journalctl --user --unit "$CONTAINER" --lines 100 --no-pager || true

              if [ -n "$PREV_SHA" ]; then
                PREV_IMAGE="ghcr.io/${{ github.repository }}:$PREV_SHA"
                sed -i "s|Image=ghcr.io/${{ github.repository }}:.*|Image=$PREV_IMAGE|" \
                  "$UNIT_FILE"
                systemctl --user daemon-reload
                systemctl --user restart "$CONTAINER" || true
              else
                echo "No previous image is available for rollback."
              fi
              exit 1
            fi

            # сохраняем текущий SHA
            echo "$SHA" > "$DEPLOY_DIR/current_sha"

            echo "Deploy successful: $SHA"
